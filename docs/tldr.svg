<text x="27" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#9399b2" letter-spacing=".3">tldr · a reply with its summary beneath</text>
<line x1="0" y1="23.5" x2="622" y2="23.5" stroke="#ffffff" stroke-opacity=".1"/>
<g fill="none" stroke-linecap="square"><path d="M20 50H602M20 86H602M17 53V83M605 53V83M17 53A3 3 0 0 1 20 50M605 53A3 3 0 0 0 602 50M17 83A3 3 0 0 0 20 86M605 83A3 3 0 0 1 602 86" stroke="#7f849c" stroke-width="1"/><path d="M20 218H602M20 290H602M17 221V287M605 221V287M17 221A3 3 0 0 1 20 218M605 221A3 3 0 0 0 602 218M17 287A3 3 0 0 0 20 290M605 287A3 3 0 0 1 602 290" stroke="#45475a" stroke-width="1"/><path d="M14 338H608M14 362H608" stroke="#888888" stroke-width="1"/></g>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#cdd6f4">
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584" y="65.4" xml:space="preserve">Without using tools, explain in two short paragraphs why a small shop sets a reorder level for</text>
<text x="26 32 38 44 50 56 62 68 74 80" y="77.4" xml:space="preserve">its stock.</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584 590 596 602" y="113.4" xml:space="preserve">A reorder level is the stock count that triggers a new order. When an item falls to that count, the</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566" y="125.4" xml:space="preserve">shop orders more, and the delivery arrives before the shelf is empty. A small shop has little</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572" y="137.4" xml:space="preserve">storage and little spare cash, so it can&apos;t keep large reserves. If an item sells out, the shop</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260" y="149.4" xml:space="preserve">loses the sale and sometimes the customer.</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560" y="173.4" xml:space="preserve">The shop sets the level from daily sales, the supplier&apos;s lead time, and a safety buffer. For</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578" y="185.4" xml:space="preserve">example, an item that sells <tspan fill="#cba6f7">10</tspan> units a day, with a <tspan fill="#cba6f7">5</tspan>-day lead time and a <tspan fill="#cba6f7">20</tspan>-unit buffer, gets a</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584 590" y="197.4" xml:space="preserve">reorder level of <tspan fill="#cba6f7">70</tspan>. The same calculation also stops the shop from overstocking, which locks cash</text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332" y="209.4" xml:space="preserve">in unsold goods, uses shelf space, and risks spoilage.</text>
<text x="26 32 38 44" y="233.4" xml:space="preserve"><tspan fill="#fab387" font-weight="700">TLDR</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560" y="245.4" xml:space="preserve"><tspan fill="#a6adc8">A reorder level is the stock count that triggers a new order so deliveries arrive before a</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578" y="257.4" xml:space="preserve"><tspan fill="#a6adc8">small shop runs out, and it also keeps the shop from tying up cash and space in excess stock.</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572" y="269.4" xml:space="preserve"><tspan fill="#a6adc8">It is set from daily sales, supplier lead time, and a safety buffer; for example, 10 units a</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404" y="281.4" xml:space="preserve"><tspan fill="#a6adc8">day, a 5-day lead time, and a 20-unit buffer give a level of 70.</tspan></text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98" y="305.4" xml:space="preserve"><tspan fill="#cba6f7">◆ </tspan><tspan fill="#7f849c">Napped in 13s</tspan></text>
