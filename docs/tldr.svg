<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584 590 596" y="149.4" xml:space="preserve">Without using tools, explain in three short paragraphs why a small shop sets a reorder level for</text>
<text x="26 32 38 44 50 56 62 68 74 80" y="161.4" xml:space="preserve">its stock.</text>
<text x="26 32 38 44" y="209.4" xml:space="preserve"><tspan fill="#fab387" font-weight="700">TLDR</tspan></text>
<text x="566 572 578 584 590 596" y="209.4" xml:space="preserve">Show ▸</text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584 590" y="221.4" xml:space="preserve"><tspan fill="#a6adc8">A reorder level is the stock count that triggers a new order, calculated as average daily sales</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584 590 596" y="233.4" xml:space="preserve"><tspan fill="#a6adc8">times lead time plus safety stock. For example, selling 5 units a day with a 4-day lead time and</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584 590" y="245.4" xml:space="preserve"><tspan fill="#a6adc8">10 units of safety stock gives a reorder level of 30. The reply reports no failures and asks no</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80" y="257.4" xml:space="preserve"><tspan fill="#a6adc8">questions.</tspan></text>
<text x="14 20 26 32 38 44 50 56 62 68 74 80 86 92 98 104" y="281.4" xml:space="preserve"><tspan fill="#cba6f7">◆ </tspan><tspan fill="#7f849c">Pounced in 17s</tspan></text>
