<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170 176 182 188 194 200 206 212 218 224 230 236 242 248 254 260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410 416 422 428 434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542" y="77.4" xml:space="preserve">What it is, and Reorder advice; write each long cell as one sentence of 14 to 18 words.</text>
<text x="26 32 38 44" y="137.4" xml:space="preserve"><tspan font-weight="700">Item</tspan></text>
<text x="194 200 206 212 218" y="137.4" xml:space="preserve"><tspan font-weight="700">Stock</tspan></text>
<text x="260 266 272 278 284 290 296 302 308 314" y="137.4" xml:space="preserve"><tspan font-weight="700">What it is</tspan></text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512" y="137.4" xml:space="preserve"><tspan font-weight="700">Reorder advice</tspan></text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110 116 122 128 134 140 146 152 158 164 170" y="161.4" xml:space="preserve">Ceramic pour-over dripper</text>
<text x="194 200 206 212 218 224 230 236" y="161.4" xml:space="preserve">12 units</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410" y="161.4" xml:space="preserve">A hand-glazed ceramic cone</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572" y="161.4" xml:space="preserve">Reorder when stock falls</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404" y="173.4" xml:space="preserve">that holds a paper filter</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572 578 584" y="173.4" xml:space="preserve">below 8 units, because the</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404" y="185.4" xml:space="preserve">and brews one or two cups</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560" y="185.4" xml:space="preserve">supplier takes about 3</text>
<text x="260 266 272 278 284 290 296 302 308 314" y="197.4" xml:space="preserve">of coffee.</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530" y="197.4" xml:space="preserve">weeks to deliver.</text>
<text x="26 32 38 44 50 56 62 68 74 80 86 92 98 104 110" y="221.4" xml:space="preserve">Linen tea towel</text>
<text x="194 200 206 212 218 224 230" y="221.4" xml:space="preserve">3 units</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380" y="221.4" xml:space="preserve">A woven linen kitchen</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560" y="221.4" xml:space="preserve">Reorder today, because</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398 404 410" y="233.4" xml:space="preserve">towel that dries glassware</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548" y="233.4" xml:space="preserve">stock sits below the</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392 398" y="245.4" xml:space="preserve">without leaving lint and</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560" y="245.4" xml:space="preserve">10-unit threshold that</text>
<text x="260 266 272 278 284 290 296 302 308 314 320 326 332 338 344 350 356 362 368 374 380 386 392" y="257.4" xml:space="preserve">softens with each wash.</text>
<text x="434 440 446 452 458 464 470 476 482 488 494 500 506 512 518 524 530 536 542 548 554 560 566 572" y="257.4" xml:space="preserve">covers a typical weekend</text>
<text x="434 440 446 452 458 464 470 476 482" y="269.4" xml:space="preserve">of sales.</text>
